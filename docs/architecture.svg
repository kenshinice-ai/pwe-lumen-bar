<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrowFall" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/>
    </marker>
    <style>
      .box   { rx: 8; stroke-width: 1.5; }
      .t     { font-size: 13px; fill: #0f172a; }
      .tb    { font-size: 13px; fill: #0f172a; font-weight: 600; }
      .ts    { font-size: 11px; fill: #475569; }
      .tw    { font-size: 13px; fill: #ffffff; font-weight: 600; }
      .lane  { font-size: 12px; fill: #64748b; font-weight: 600; letter-spacing: .04em; }
      .fall  { font-size: 11px; fill: #b45309; }
      .priv  { font-size: 10px; fill: #7c2d12; }
    </style>
  </defs>

  <rect width="960" height="620" fill="#ffffff"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f172a">Lumen — 架构与能力路由 / Architecture &amp; capability routing</text>
  <text x="24" y="54" class="ts">每项能力都按通道降级，探测不到就在界面上灰掉 · Every capability falls back down a chain; what cannot be probed is greyed out, never faked</text>

  <!-- Lane labels -->
  <text x="24" y="92" class="lane">APP</text>
  <text x="24" y="182" class="lane">UI</text>
  <text x="24" y="292" class="lane">CORE</text>
  <text x="24" y="432" class="lane">CHANNELS</text>
  <text x="24" y="560" class="lane">HARDWARE</text>

  <!-- APP -->
  <rect x="80" y="72" width="200" height="34" class="box" fill="#1e293b" stroke="#0f172a"/>
  <text x="180" y="94" text-anchor="middle" class="tw">MenuBarExtra</text>
  <rect x="300" y="72" width="200" height="34" class="box" fill="#1e293b" stroke="#0f172a"/>
  <text x="400" y="94" text-anchor="middle" class="tw">HotKeyCenter ⌃⌥</text>
  <text x="516" y="88" class="ts">全局快捷键作用于光标所在屏</text>
  <text x="516" y="102" class="ts">Shortcuts act on the display under the pointer</text>

  <!-- UI -->
  <rect x="80" y="152" width="420" height="44" class="box" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="98" y="171" class="tb">DisplayController</text>
  <text x="98" y="188" class="ts">乐观更新 + 合并写入（DDC 每次数十毫秒）· optimistic UI, coalesced writes</text>

  <rect x="520" y="152" width="180" height="44" class="box" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="610" y="171" text-anchor="middle" class="tb">ConfirmRevert</text>
  <text x="610" y="188" text-anchor="middle" class="ts">15s 自动回滚 / auto-revert</text>

  <rect x="720" y="152" width="200" height="44" class="box" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="820" y="171" text-anchor="middle" class="tb">L10n</text>
  <text x="820" y="188" text-anchor="middle" class="ts">中文 / English</text>

  <!-- CORE engines -->
  <g>
    <rect x="80" y="252" width="150" height="60" class="box" fill="#f0fdf4" stroke="#86efac"/>
    <text x="155" y="274" text-anchor="middle" class="tb">ModeEngine</text>
    <text x="155" y="292" text-anchor="middle" class="ts">分辨率 / HiDPI</text>

    <rect x="245" y="252" width="150" height="60" class="box" fill="#f0fdf4" stroke="#86efac"/>
    <text x="320" y="274" text-anchor="middle" class="tb">Brightness</text>
    <text x="320" y="292" text-anchor="middle" class="ts">亮度 / 对比度</text>

    <rect x="410" y="252" width="140" height="60" class="box" fill="#f0fdf4" stroke="#86efac"/>
    <text x="480" y="274" text-anchor="middle" class="tb">Audio</text>
    <text x="480" y="292" text-anchor="middle" class="ts">音量 / 静音</text>

    <rect x="565" y="252" width="130" height="60" class="box" fill="#f0fdf4" stroke="#86efac"/>
    <text x="630" y="274" text-anchor="middle" class="tb">Rotation</text>
    <text x="630" y="292" text-anchor="middle" class="ts">方向</text>

    <rect x="710" y="252" width="210" height="60" class="box" fill="#f0fdf4" stroke="#86efac"/>
    <text x="815" y="274" text-anchor="middle" class="tb">Power / Input</text>
    <text x="815" y="292" text-anchor="middle" class="ts">断开 · 镜像 · 输入源</text>
  </g>

  <!-- Gate -->
  <rect x="80" y="336" width="840" height="34" class="box" fill="#fef3c7" stroke="#fcd34d"/>
  <text x="98" y="358" class="t"><tspan font-weight="600">ConnectionType 闸门 / gate</tspan>  —  AirPlay 与虚拟屏没有 I2C 线路，直接跳过 DDC，省下每次刷新 3 次失败重试 · AirPlay and virtual displays skip DDC entirely</text>

  <!-- CHANNELS -->
  <g>
    <rect x="80" y="400" width="150" height="66" class="box" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="155" y="422" text-anchor="middle" class="tb">CGS 模式表</text>
    <text x="155" y="439" text-anchor="middle" class="priv">私有 / private</text>
    <text x="155" y="455" text-anchor="middle" class="ts">布局自校验 212</text>

    <rect x="245" y="400" width="150" height="66" class="box" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="320" y="422" text-anchor="middle" class="tb">DisplayServices</text>
    <text x="320" y="439" text-anchor="middle" class="priv">私有 / private</text>
    <text x="320" y="455" text-anchor="middle" class="ts">内建 · Apple 屏</text>

    <rect x="410" y="400" width="140" height="66" class="box" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="480" y="422" text-anchor="middle" class="tb">DDC / I2C</text>
    <text x="480" y="439" text-anchor="middle" class="priv">IOAVService</text>
    <text x="480" y="455" text-anchor="middle" class="ts">VCP 10·12·62·60·D6</text>

    <rect x="565" y="400" width="130" height="66" class="box" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="630" y="422" text-anchor="middle" class="tb">CoreAudio</text>
    <text x="630" y="439" text-anchor="middle" class="ts">公开 / public</text>

    <rect x="710" y="400" width="100" height="66" class="box" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="760" y="422" text-anchor="middle" class="tb">IOKit</text>
    <text x="760" y="439" text-anchor="middle" class="ts">probe</text>
    <text x="760" y="455" text-anchor="middle" class="ts">旋转</text>

    <rect x="820" y="400" width="100" height="66" class="box" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="870" y="422" text-anchor="middle" class="tb">Gamma</text>
    <text x="870" y="439" text-anchor="middle" class="ts">软件调光</text>
    <text x="870" y="455" text-anchor="middle" class="ts">software</text>
  </g>

  <!-- Fallback chain for brightness -->
  <path d="M 320 466 C 320 486, 480 486, 480 470" fill="none" stroke="#b45309" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arrowFall)"/>
  <path d="M 550 480 C 700 500, 820 495, 868 470" fill="none" stroke="#b45309" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arrowFall)"/>
  <text x="470" y="503" text-anchor="middle" class="fall">亮度降级链 · brightness falls back: DisplayServices → DDC → Gamma</text>

  <!-- HARDWARE -->
  <rect x="80" y="524" width="260" height="44" class="box" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="210" y="551" text-anchor="middle" class="t">内建屏 / Built-in panel</text>
  <rect x="355" y="524" width="270" height="44" class="box" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="490" y="551" text-anchor="middle" class="t">外接屏 HDMI · DP · USB-C</text>
  <rect x="640" y="524" width="280" height="44" class="box" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="780" y="551" text-anchor="middle" class="t">AirPlay · DisplayLink · 虚拟</text>

  <!-- Connectors -->
  <path d="M 180 106 L 180 152" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path d="M 400 106 L 300 152" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path d="M 290 196 L 290 252" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path d="M 500 312 L 500 336" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path d="M 500 370 L 500 400" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path d="M 210 466 L 210 524" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path d="M 490 466 L 490 524" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path d="M 870 466 L 800 524" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/>
</svg>
