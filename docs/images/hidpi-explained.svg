<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif">
  <style>
    .t { font-size: 13px; fill: #0f172a; }
    .ts { font-size: 11.5px; fill: #64748b; }
    .tb { font-size: 14px; fill: #0f172a; font-weight: 650; }
    .lab { font-size: 11px; fill: #94a3b8; font-weight: 600; letter-spacing: .05em; }
    .good { fill: #15803d; font-size: 12px; font-weight: 600; }
    .bad { fill: #b45309; font-size: 12px; font-weight: 600; }
  </style>
  <rect width="1000" height="470" fill="#ffffff"/>
  <text x="24" y="32" class="tb">为什么 Mac 接上 4K 显示器，文字反而不如笔记本屏清楚</text>
  <text x="24" y="52" class="ts">Why a Mac's text looks softer on a 4K monitor than on its own screen</text>

  <!-- Column 1: 1x -->
  <text x="24" y="92" class="lab">1× · 3840 × 2160</text>
  <rect x="24" y="104" width="240" height="135" rx="7" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="34" y="126" style="font-size:7px" fill="#0f172a">系统设置</text>
  <text x="34" y="138" style="font-size:7px" fill="#475569">显示器 · 亮度 · 排列</text>
  <rect x="34" y="146" width="90" height="5" rx="2" fill="#cbd5e1"/>
  <rect x="34" y="155" width="70" height="5" rx="2" fill="#e2e8f0"/>
  <rect x="34" y="164" width="110" height="5" rx="2" fill="#e2e8f0"/>
  <text x="24" y="262" class="t">按面板原生分辨率渲染</text>
  <text x="24" y="280" class="ts">Rendered at the panel's native resolution</text>
  <text x="24" y="302" class="bad">文字锐利，但小到费眼</text>
  <text x="24" y="318" class="ts">Sharp, but too small to read comfortably</text>

  <!-- Column 2: 2x -->
  <text x="330" y="92" class="lab">2× · 看起来像 1920 × 1080</text>
  <rect x="330" y="104" width="240" height="135" rx="7" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="344" y="134" style="font-size:14px" fill="#0f172a">系统设置</text>
  <text x="344" y="156" style="font-size:14px" fill="#475569">显示器</text>
  <rect x="344" y="168" width="150" height="9" rx="4" fill="#cbd5e1"/>
  <rect x="344" y="184" width="120" height="9" rx="4" fill="#e2e8f0"/>
  <text x="330" y="262" class="t">以 2 倍渲染，元素放大一倍</text>
  <text x="330" y="280" class="ts">Rendered at 2×, everything doubles</text>
  <text x="330" y="302" class="bad">锐利，但浪费了一块 4K 屏</text>
  <text x="330" y="318" class="ts">Sharp, but wastes a 4K panel</text>

  <!-- Column 3: HiDPI scaled -->
  <text x="700" y="92" class="lab">2× 渲染再缩放 · 看起来像 2560 × 1440</text>
  <rect x="700" y="104" width="240" height="135" rx="7" fill="#f0fdf4" stroke="#86efac"/>
  <text x="712" y="128" style="font-size:10px" fill="#0f172a">系统设置</text>
  <text x="712" y="146" style="font-size:10px" fill="#475569">显示器 · 亮度</text>
  <rect x="712" y="156" width="120" height="7" rx="3" fill="#bbf7d0"/>
  <rect x="712" y="169" width="95" height="7" rx="3" fill="#dcfce7"/>
  <rect x="712" y="182" width="140" height="7" rx="3" fill="#dcfce7"/>
  <text x="700" y="262" class="t">渲染 5120 × 2880，输出 3840 × 2160</text>
  <text x="700" y="280" class="ts">Rendered 5120 × 2880, output 3840 × 2160</text>
  <text x="700" y="302" class="good">锐利，而且大小正好</text>
  <text x="700" y="318" class="ts">Sharp, and the right size</text>

  <!-- The problem band -->
  <rect x="24" y="352" width="952" height="46" rx="9" fill="#fef3c7" stroke="#fcd34d"/>
  <text x="40" y="372" class="t"><tspan font-weight="650">问题在于：</tspan>第三档需要显示器主动报告对应的 HiDPI 模式。很多显示器不报，macOS 就只能把非原生分辨率拉伸上去 —— 每个像素都重采样一次，于是「字有点糊」。</text>
  <text x="40" y="390" class="ts">The third option needs the monitor to advertise that HiDPI mode. Many never do, so macOS stretches a non-native resolution instead — resampling every pixel, which is the blur people notice.</text>

  <rect x="24" y="410" width="952" height="42" rx="9" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="40" y="430" class="t"><tspan font-weight="650">Lumen 的强制 HiDPI：</tspan>把缺失的 2 倍模式写进系统的显示器覆盖文件，重启后第三档就出现了。需要管理员密码，随时可移除。</text>
  <text x="40" y="446" class="ts">Forced HiDPI writes the missing 2× modes into the system's display override file. Needs an admin password, removable at any time.</text>
</svg>
