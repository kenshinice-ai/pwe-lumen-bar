<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; }
    .h1 { font-size: 17px; font-weight: 700; fill: #1D1D1F; }
    .sub { font-size: 12px; fill: #6E6E73; }
    .t { font-size: 12.5px; fill: #1D1D1F; }
    .tm { font-size: 12px; font-weight: 600; fill: #1D1D1F; }
    .ts { font-size: 11px; fill: #6E6E73; }
    .tt { font-size: 10px; fill: #98989D; }
    .num { font-size: 11px; font-weight: 700; fill: #FFFFFF; }
    .lead { stroke: #0A84FF; stroke-width: 1.1; fill: none; stroke-dasharray: 4 3; }
  </style>

  <rect width="1000" height="340" fill="#FFFFFF"/>
  <text x="24" y="30" class="h1">菜单栏图标：三种操作</text>
  <text x="24" y="50" class="sub">PWE Lumen Bar 不进 Dock，只有菜单栏这一个入口</text>

  <!-- menu bar strip -->
  <rect x="24" y="74" width="952" height="28" rx="6" fill="#F5F5F7" stroke="#D2D2D7"/>
  <text x="44" y="92" class="ts">Finder　文件　编辑　显示　窗口　帮助</text>
  <rect x="690" y="81" width="12" height="9" rx="2" fill="none" stroke="#98989D" stroke-width="1.2"/>
  <path d="M 722 90 L 728 80 L 734 90 Z" fill="none" stroke="#98989D" stroke-width="1.2"/>
  <circle cx="754" cy="87" r="5" fill="none" stroke="#98989D" stroke-width="1.2"/>
  <rect x="776" y="77" width="28" height="22" rx="5" fill="#E3EEFF"/>
  <rect x="782" y="80" width="13" height="9.5" rx="2" fill="none" stroke="#1D1D1F" stroke-width="1.4"/>
  <rect x="787" y="84" width="13" height="9.5" rx="2" fill="#FFFFFF" stroke="#1D1D1F" stroke-width="1.4"/>
  <text x="952" y="92" text-anchor="end" class="ts">9:41</text>

  <!-- fan-out leaders -->
  <path class="lead" d="M 788 104 L 140 128"/>
  <path class="lead" d="M 790 104 L 466 128"/>
  <path class="lead" d="M 792 104 L 792 128"/>

  <!-- 1 left click -->
  <circle cx="140" cy="140" r="10" fill="#0A84FF"/>
  <text x="140" y="144" text-anchor="middle" class="num">1</text>
  <text x="157" y="145" class="tm">左键</text>

  <rect x="64" y="164" width="220" height="150" rx="10" fill="#FFFFFF" stroke="#D2D2D7"/>
  <rect x="78" y="177" width="11" height="8" rx="1.5" fill="none" stroke="#0A84FF" stroke-width="1.3"/>
  <rect x="80.5" y="186" width="6" height="1.6" fill="#0A84FF"/>
  <text x="95" y="186" class="tm">PWE Lumen Bar</text>
  <text x="272" y="186" text-anchor="end" class="tt">2 块屏幕</text>
  <line x1="64" y1="196" x2="284" y2="196" stroke="#E3E3E6"/>
  <rect x="76" y="206" width="196" height="96" rx="8" fill="#F2F2F5"/>
  <text x="88" y="223" class="ts">27B1U3900</text>
  <rect x="88" y="238" width="150" height="4" rx="2" fill="#D8D8DC"/>
  <rect x="88" y="238" width="98" height="4" rx="2" fill="#0A84FF"/>
  <circle cx="186" cy="240" r="5" fill="#FFFFFF" stroke="#C7C7CC"/>
  <rect x="88" y="260" width="150" height="4" rx="2" fill="#D8D8DC"/>
  <rect x="88" y="260" width="52" height="4" rx="2" fill="#0A84FF"/>
  <circle cx="140" cy="262" r="5" fill="#FFFFFF" stroke="#C7C7CC"/>
  <rect x="88" y="282" width="150" height="4" rx="2" fill="#D8D8DC"/>
  <rect x="88" y="282" width="120" height="4" rx="2" fill="#0A84FF"/>
  <circle cx="208" cy="284" r="5" fill="#FFFFFF" stroke="#C7C7CC"/>

