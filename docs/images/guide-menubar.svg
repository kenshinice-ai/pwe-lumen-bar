  <rect x="440" y="164" width="120" height="120" rx="16" fill="#FFFFFF" stroke="#D2D2D7"/>
  <circle cx="500" cy="200" r="9" fill="#1D1D1F"/>
  <g stroke="#1D1D1F" stroke-width="2" stroke-linecap="round">
    <line x1="500" y1="183" x2="500" y2="187"/>
    <line x1="500" y1="213" x2="500" y2="217"/>
    <line x1="483" y1="200" x2="487" y2="200"/>
    <line x1="513" y1="200" x2="517" y2="200"/>
    <line x1="488" y1="188" x2="491" y2="191"/>
    <line x1="509" y1="209" x2="512" y2="212"/>
    <line x1="488" y1="212" x2="491" y2="209"/>
    <line x1="509" y1="191" x2="512" y2="188"/>
  </g>
  <g fill="#D8D8DC">
    <rect x="453" y="230" width="4.5" height="4.5"/><rect x="459" y="230" width="4.5" height="4.5"/>
    <rect x="465" y="230" width="4.5" height="4.5"/><rect x="471" y="230" width="4.5" height="4.5"/>
    <rect x="477" y="230" width="4.5" height="4.5"/><rect x="483" y="230" width="4.5" height="4.5"/>
    <rect x="489" y="230" width="4.5" height="4.5"/><rect x="495" y="230" width="4.5" height="4.5"/>
    <rect x="501" y="230" width="4.5" height="4.5"/><rect x="507" y="230" width="4.5" height="4.5"/>
    <rect x="513" y="230" width="4.5" height="4.5"/><rect x="519" y="230" width="4.5" height="4.5"/>
    <rect x="525" y="230" width="4.5" height="4.5"/><rect x="531" y="230" width="4.5" height="4.5"/>
    <rect x="537" y="230" width="4.5" height="4.5"/><rect x="543" y="230" width="4.5" height="4.5"/>
  </g>
  <g fill="#1D1D1F">
    <rect x="453" y="230" width="4.5" height="4.5"/><rect x="459" y="230" width="4.5" height="4.5"/>
    <rect x="465" y="230" width="4.5" height="4.5"/><rect x="471" y="230" width="4.5" height="4.5"/>
    <rect x="477" y="230" width="4.5" height="4.5"/><rect x="483" y="230" width="4.5" height="4.5"/>
    <rect x="489" y="230" width="4.5" height="4.5"/><rect x="495" y="230" width="4.5" height="4.5"/>
    <rect x="501" y="230" width="4.5" height="4.5"/><rect x="507" y="230" width="4.5" height="4.5"/>
  </g>
  <text x="500" y="258" text-anchor="middle" class="tt">27B1U3900</text>

  <!-- 3 right click -->
  <circle cx="792" cy="140" r="10" fill="#0A84FF"/>
  <text x="792" y="144" text-anchor="middle" class="num">3</text>
  <text x="809" y="145" class="tm">右键</text>

  <rect x="716" y="164" width="220" height="108" rx="8" fill="#FFFFFF" stroke="#D2D2D7"/>
  <text x="734" y="192" class="t">工作</text>
  <text x="734" y="216" class="t">夜间</text>
  <line x1="726" y1="228" x2="926" y2="228" stroke="#E3E3E6"/>
  <text x="734" y="250" class="t">退出 PWE Lumen Bar</text>
  <text x="918" y="250" text-anchor="end" class="tt">⌘Q</text>
</svg>
