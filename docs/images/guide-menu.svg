  <g stroke="#FFFFFF" stroke-width="1.3"><line x1="457.5" y1="490.5" x2="462.5" y2="495.5"/><line x1="462.5" y1="490.5" x2="457.5" y2="495.5"/></g>
  <line x1="100" y1="510" x2="480" y2="510" stroke="#E3E3E6"/>

