  <circle cx="127" cy="147" r="8" fill="#0A84FF"/>
  <circle cx="127" cy="147" r="3" fill="#FFFFFF"/>
  <g stroke="#FFFFFF" stroke-width="1.1" stroke-linecap="round">
    <line x1="127" y1="141" x2="127" y2="142.6"/><line x1="127" y1="151.4" x2="127" y2="153"/>
    <line x1="121" y1="147" x2="122.6" y2="147"/><line x1="131.4" y1="147" x2="133" y2="147"/>
  </g>
  <text x="140" y="151" class="ts">全部</text>
  <rect x="176" y="145" width="232" height="4" rx="2" fill="#D8D8DC"/>
  <rect x="176" y="145" width="167" height="4" rx="2" fill="#0A84FF"/>
  <circle cx="343" cy="147" r="7" fill="#FFFFFF" stroke="#C7C7CC"/>
  <text x="455" y="151" text-anchor="end" class="val">72%</text>

  <!-- ===================== card 1 ===================== -->
  <rect x="113" y="178" width="354" height="285" rx="13" fill="#EAEAEE"/>

  <!-- title row -->
  <rect x="126" y="196" width="14" height="10" rx="1.8" fill="none" stroke="#0A84FF" stroke-width="1.4"/>
  <rect x="130" y="207" width="6" height="1.6" rx="0.8" fill="#0A84FF"/>
  <text x="147" y="205" class="tm">Philips 27B1U3900</text>
