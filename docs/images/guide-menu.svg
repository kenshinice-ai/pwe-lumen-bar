  <rect width="1000" height="600" fill="#FFFFFF"/>
  <text x="24" y="30" class="h1">菜单面板：一块屏一张卡片</text>
  <text x="24" y="50" class="sub">面板宽度固定，屏幕多了就在列表里滚动</text>

  <!-- ===================== popover ===================== -->
  <rect x="100" y="76" width="380" height="472" rx="12" fill="#F5F5F7" stroke="#D2D2D7"/>

  <!-- header -->
  <rect x="115" y="90" width="12" height="9" rx="1.6" fill="none" stroke="#0A84FF" stroke-width="1.4"/>
  <rect x="118" y="100" width="6" height="1.6" rx="0.8" fill="#0A84FF"/>
  <text x="134" y="101" style="font-size:14px;font-weight:600" fill="#1D1D1F">Lumen</text>
  <text x="440" y="101" text-anchor="end" class="tt">2 块屏幕</text>
  <g transform="translate(462,96)" stroke="#0A84FF" stroke-width="1.5" fill="none">
    <path d="M 6 -1.5 A 6 6 0 1 0 4.6 4.6"/>
    <path d="M 2.5 -3 L 6.4 -2 L 7.2 -6" stroke-linecap="round"/>
  </g>
  <line x1="100" y1="116" x2="480" y2="116" stroke="#E3E3E6"/>

  <!-- master brightness row -->
