  <g stroke="#FFFFFF" stroke-width="1.1"><line x1="263" y1="247.5" x2="269" y2="247.5"/><line x1="263" y1="250.5" x2="269" y2="250.5"/></g>
  <text x="275" y="253" class="ts">统一亮度</text>

  <!-- brightness -->
  <circle cx="135" cy="282" r="3.6" fill="#6E6E73"/>
  <g stroke="#6E6E73" stroke-width="1.2" stroke-linecap="round">
    <line x1="135" y1="275" x2="135" y2="276.8"/><line x1="135" y1="287.2" x2="135" y2="289"/>
    <line x1="128" y1="282" x2="129.8" y2="282"/><line x1="140.2" y1="282" x2="142" y2="282"/>
    <line x1="130.1" y1="277.1" x2="131.4" y2="278.4"/><line x1="138.6" y1="285.6" x2="139.9" y2="286.9"/>
    <line x1="130.1" y1="286.9" x2="131.4" y2="285.6"/><line x1="138.6" y1="278.4" x2="139.9" y2="277.1"/>
