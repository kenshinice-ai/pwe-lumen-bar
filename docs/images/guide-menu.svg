  <text x="599" y="303" style="font-size:10px" fill="#A1A1A6">软件调光：背光不变，只是画面变暗</text>

  <rect x="579.4" y="323" width="5.2" height="11" rx="2.6" fill="none" stroke="#6E6E73" stroke-width="1.2"/>
