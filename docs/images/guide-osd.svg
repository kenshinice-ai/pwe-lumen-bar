<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; }
    .h1 { font-size: 17px; font-weight: 700; fill: #1D1D1F; }
    .sub { font-size: 12px; fill: #6E6E73; }
    .sec { font-size: 11px; font-weight: 600; fill: #6E6E73; }
    .t { font-size: 12.5px; fill: #1D1D1F; }
    .tb { font-size: 13.5px; font-weight: 600; fill: #1D1D1F; }
    .ts { font-size: 11px; fill: #6E6E73; }
    .tt { font-size: 10px; fill: #98989D; }
    .num { font-size: 11px; font-weight: 700; fill: #FFFFFF; }
    .lead { stroke: #0A84FF; stroke-width: 1.1; fill: none; }
  </style>

  <rect width="1000" height="520" fill="#FFFFFF"/>
  <text x="24" y="30" class="h1">三种会自己出现的反馈</text>
  <text x="24" y="50" class="sub">调节 HUD、15 秒确认面板、面板里的状态栏</text>

  <!-- screen context -->
  <text x="40" y="72" class="sec">HUD 出现在被调节的那块屏上</text>
  <rect x="40" y="80" width="300" height="180" rx="8" fill="#F5F5F7" stroke="#D2D2D7"/>
  <rect x="52" y="92" width="276" height="156" rx="4" fill="#FFFFFF"/>
  <rect x="175" y="260" width="30" height="10" fill="#D2D2D7"/>
  <rect x="150" y="270" width="80" height="5" rx="2.5" fill="#C7C7CC"/>
  <rect x="160" y="184" width="60" height="60" rx="9" fill="#E8E8EC" stroke="#D2D2D7"/>
  <circle cx="190" cy="205" r="6" fill="#1D1D1F"/>
  <g stroke="#1D1D1F" stroke-width="1.4" stroke-linecap="round">
    <line x1="190" y1="194" x2="190" y2="196"/><line x1="190" y1="214" x2="190" y2="216"/>
    <line x1="179" y1="205" x2="181" y2="205"/><line x1="199" y1="205" x2="201" y2="205"/>
  </g>
  <g fill="#C7C7CC">
    <rect x="172" y="224" width="3" height="3"/><rect x="176" y="224" width="3" height="3"/>
    <rect x="180" y="224" width="3" height="3"/><rect x="184" y="224" width="3" height="3"/>
    <rect x="188" y="224" width="3" height="3"/><rect x="192" y="224" width="3" height="3"/>
    <rect x="196" y="224" width="3" height="3"/><rect x="200" y="224" width="3" height="3"/>
    <rect x="204" y="224" width="3" height="3"/>
  </g>
  <g fill="#1D1D1F">
    <rect x="172" y="224" width="3" height="3"/><rect x="176" y="224" width="3" height="3"/>
    <rect x="180" y="224" width="3" height="3"/><rect x="184" y="224" width="3" height="3"/>
    <rect x="188" y="224" width="3" height="3"/><rect x="192" y="224" width="3" height="3"/>
  </g>
  <text x="190" y="238" text-anchor="middle" style="font-size:6px" fill="#6E6E73">27B1U3900</text>

  <!-- level HUD -->
  <text x="390" y="72" class="sec">调节 HUD</text>
  <rect x="390" y="80" width="200" height="200" rx="20" fill="#F2F2F5" stroke="#D2D2D7"/>
  <circle cx="490" cy="140" r="20" fill="#1D1D1F"/>
  <g stroke="#1D1D1F" stroke-width="3.4" stroke-linecap="round">
    <line x1="490" y1="107" x2="490" y2="113"/><line x1="490" y1="167" x2="490" y2="173"/>
    <line x1="457" y1="140" x2="463" y2="140"/><line x1="517" y1="140" x2="523" y2="140"/>
    <line x1="466" y1="116" x2="470" y2="120"/><line x1="510" y1="160" x2="514" y2="164"/>
    <line x1="466" y1="164" x2="470" y2="160"/><line x1="510" y1="120" x2="514" y2="116"/>
  </g>
  <g fill="#D2D2D7">
    <rect x="415" y="196" width="8" height="8"/><rect x="425" y="196" width="8" height="8"/>
    <rect x="435" y="196" width="8" height="8"/><rect x="445" y="196" width="8" height="8"/>
    <rect x="455" y="196" width="8" height="8"/><rect x="465" y="196" width="8" height="8"/>
    <rect x="475" y="196" width="8" height="8"/><rect x="485" y="196" width="8" height="8"/>
    <rect x="495" y="196" width="8" height="8"/><rect x="505" y="196" width="8" height="8"/>
    <rect x="515" y="196" width="8" height="8"/><rect x="525" y="196" width="8" height="8"/>
    <rect x="535" y="196" width="8" height="8"/><rect x="545" y="196" width="8" height="8"/>
    <rect x="555" y="196" width="8" height="8"/><rect x="565" y="196" width="8" height="8"/>
  </g>
  <g fill="#1D1D1F">
    <rect x="415" y="196" width="8" height="8"/><rect x="425" y="196" width="8" height="8"/>
    <rect x="435" y="196" width="8" height="8"/><rect x="445" y="196" width="8" height="8"/>
    <rect x="455" y="196" width="8" height="8"/><rect x="465" y="196" width="8" height="8"/>
    <rect x="475" y="196" width="8" height="8"/><rect x="485" y="196" width="8" height="8"/>
    <rect x="495" y="196" width="8" height="8"/><rect x="505" y="196" width="8" height="8"/>
    <rect x="515" y="196" width="8" height="8"/>
  </g>
  <text x="490" y="240" text-anchor="middle" class="ts">27B1U3900</text>

  <!-- message HUD -->
  <text x="640" y="72" class="sec">消息 HUD</text>
  <rect x="640" y="80" width="200" height="200" rx="20" fill="#F2F2F5" stroke="#D2D2D7"/>
  <text x="740" y="114" text-anchor="middle" class="tt" fill="#6E6E73" style="font-weight:600">Lumen · 自动化命令</text>
  <path d="M 740 132 L 768 180 L 712 180 Z" fill="#1D1D1F"/>
  <rect x="738" y="148" width="4" height="16" rx="2" fill="#F2F2F5"/>
  <circle cx="740" cy="172" r="2.4" fill="#F2F2F5"/>
  <text x="740" y="222" text-anchor="middle" class="t">找不到那块屏</text>

  <!-- confirm panel -->
  <text x="40" y="312" class="sec">15 秒确认面板</text>
  <rect x="40" y="320" width="340" height="168" rx="10" fill="#F5F5F7" stroke="#D2D2D7"/>
  <text x="60" y="352" class="tb">保留这个分辨率？</text>
  <text x="60" y="376" class="ts">Philips 27B1U3900 已切换到 2560 × 1440</text>
  <text x="60" y="392" class="ts">HiDPI 2x → 5120 × 2880  60 Hz</text>
  <rect x="60" y="406" width="300" height="4" rx="2" fill="#D8D8DC"/>
  <rect x="60" y="406" width="240" height="4" rx="2" fill="#0A84FF"/>
  <text x="60" y="436" class="tt">12 秒后自动恢复</text>
  <rect x="222" y="422" width="60" height="24" rx="6" fill="#FFFFFF" stroke="#C7C7CC"/>
  <text x="252" y="438" text-anchor="middle" class="ts" fill="#1D1D1F">恢复</text>
  <rect x="292" y="422" width="60" height="24" rx="6" fill="#0A84FF"/>
  <text x="322" y="438" text-anchor="middle" class="ts" fill="#FFFFFF">保留</text>

  <!-- status bar -->
  <text x="440" y="312" class="sec">面板里的状态栏</text>
  <rect x="440" y="320" width="400" height="46" rx="8" fill="#F5F5F7" stroke="#D2D2D7"/>
  <circle cx="460" cy="343" r="6" fill="none" stroke="#6E6E73" stroke-width="1.1"/>
  <text x="460" y="346.5" text-anchor="middle" style="font-size:9px" fill="#6E6E73">i</text>
  <text x="474" y="347" class="ts">已还原被改动的配置：Philips 27B1U3900</text>
  <circle cx="820" cy="343" r="6" fill="#C7C7CC"/>
  <g stroke="#FFFFFF" stroke-width="1.3"><line x1="817.5" y1="340.5" x2="822.5" y2="345.5"/><line x1="822.5" y1="340.5" x2="817.5" y2="345.5"/></g>

  <!-- callouts -->
  <circle cx="362" cy="214" r="10" fill="#0A84FF"/><text x="362" y="218" text-anchor="middle" class="num">1</text>
  <path class="lead" d="M 352 214 L 224 214"/>
  <circle cx="610" cy="200" r="10" fill="#0A84FF"/><text x="610" y="204" text-anchor="middle" class="num">2</text>
  <path class="lead" d="M 599 200 L 586 200"/>
  <circle cx="610" cy="236" r="10" fill="#0A84FF"/><text x="610" y="240" text-anchor="middle" class="num">3</text>
  <path class="lead" d="M 599 236 L 586 236"/>
  <circle cx="866" cy="114" r="10" fill="#0A84FF"/><text x="866" y="118" text-anchor="middle" class="num">4</text>
  <path class="lead" d="M 855 114 L 838 114"/>
  <circle cx="404" cy="352" r="10" fill="#0A84FF"/><text x="404" y="356" text-anchor="middle" class="num">5</text>
  <path class="lead" d="M 393 352 L 378 352"/>
  <circle cx="404" cy="434" r="10" fill="#0A84FF"/><text x="404" y="438" text-anchor="middle" class="num">6</text>
  <path class="lead" d="M 393 434 L 378 434"/>
  <circle cx="866" cy="343" r="10" fill="#0A84FF"/><text x="866" y="347" text-anchor="middle" class="num">7</text>
  <path class="lead" d="M 855 343 L 838 343"/>
</svg>
